<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore K-Pop artists, songs, albums, music videos, and favorites."
    />
    <title>K-Pop Explorer | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>
  <body>
    <header id="main-header"></header>
    <main>
      <section class="hero-shell" aria-labelledby="home-title">
        <div class="hero-copy">
          <p class="eyebrow">TWICE + K-Pop discovery hub</p>
          <h1 id="home-title">K-Pop Explorer</h1>
          <p>
            Search artists, browse discographies, watch videos, and save your
            favorite groups in one fan-focused app.
          </p>
          <form class="hero-search" action="/search/" method="get">
            <label for="home-search">Search artists</label>
            <input
              id="home-search"
              name="query"
              type="search"
              placeholder="Search TWICE, ITZY, IVE..."
              required
            />
            <button type="submit">Search</button>
          </form>
        </div>
        <article class="featured-panel" id="featured-artist"></article>
      </section>

      <section class="content-section" aria-labelledby="popular-title">
        <div class="section-heading">
          <p class="eyebrow">Start exploring</p>
          <h2 id="popular-title">Popular K-Pop Artists</h2>
        </div>
        <ul class="artist-grid" id="popular-artists"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
