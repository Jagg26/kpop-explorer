<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Pop Explorer | Compare</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/compare.js" type="module"></script>
  </head>
  <body>
    <header id="main-header"></header>
    <main>
      <section class="content-section">
        <div class="section-heading">
          <p class="eyebrow">Stretch feature</p>
          <h1>Compare Popularity</h1>
        </div>
        <form class="compare-form" id="compare-form">
          <label>
            Artist one
            <select id="artist-one"></select>
          </label>
          <label>
            Artist two
            <select id="artist-two"></select>
          </label>
          <button type="submit">Compare</button>
        </form>
        <section class="comparison-results" id="comparison-results"></section>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
